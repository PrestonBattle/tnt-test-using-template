# TNT Dental — CloudCannon CMS Configuration

paths:
  static: public
  uploads: public/uploads

timezone: America/New_York

markdown:
  engine: commonmark
  options:
    gfm: true

build:
  install_command: npm install
  build_command: npm run build
  output: dist

collections_config:
  site:
    path: src/content
    name: Site Settings
    icon: settings

  services:
    path: src/content
    name: Services
    icon: list

  team:
    path: src/content
    name: Team Members
    icon: person

data_config:
  site:
    path: src/content/site.json
  services:
    path: src/content/services.json
  team:
    path: src/content/team.json

_inputs:
  acceptingPatients:
    type: checkbox
  tagline:
    type: text
    comment: Keep this under 8 words for best display
  subtext:
    type: textarea
  bio:
    type: textarea
  description:
    type: textarea
  hours:
    type: text
    comment: e.g. Mon-Fri 8am-6pm, Sat 9am-2pm